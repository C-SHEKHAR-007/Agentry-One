# Agentry One -- a one-shot migration, the API, the worker runner and the web
# UI, on a private network. Only the web UI is published; it proxies /api to
# the API internally. PostgreSQL and Redis are NOT in compose: they run
# natively on the host and are reached through DATABASE_URL / REDIS_URL.
#
#   cp .env.example .env   # set DATABASE_URL, REDIS_URL, AGENTRY_API_KEY, AGENTRY_CREDENTIALS_KEY
#   docker compose up -d --build
#   open http://localhost:${WEB_PORT:-8080}
#
# On this private network "localhost" is the container itself: point the URLs
# at host.docker.internal and make PostgreSQL/Redis listen on docker0
# (172.17.0.1). scripts/local-up.sh (host networking) uses localhost as-is.

x-app-env: &app-env
  REDIS_URL: ${REDIS_URL:?set REDIS_URL}
  AGENTRY_API_KEY: ${AGENTRY_API_KEY:?set AGENTRY_API_KEY}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
  AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-agentry-artifacts}
  ARTIFACTS_DIR: /artifacts
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-database-url: &database-url ${DATABASE_URL:?set DATABASE_URL}

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  migrate:
    build:
      context: ./apps/api
      target: migrate
    environment:
      DATABASE_URL: *database-url
    extra_hosts: *host-gateway
    restart: "no"
    networks: [backend]

  api:
    build:
      context: ./apps/api
      target: runtime
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_URL: *database-url
      AGENTRY_CREDENTIALS_KEY: ${AGENTRY_CREDENTIALS_KEY:?set AGENTRY_CREDENTIALS_KEY}
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      PROVIDER_PRIVATE_HOSTS: ${PROVIDER_PRIVATE_HOSTS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      INSTAGRAM_HELPER_URL: ${INSTAGRAM_HELPER_URL:-}
    volumes:
      # Read-write: Agent Studio scaffolds new agents here, and the worker
      # supervisor picks them up from the same directory.
      - ./agents:/agents
      - ./social-connectors:/social-connectors:ro
      - artifacts:/artifacts
    extra_hosts: *host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        INSTALL_LOCAL_SD: ${INSTALL_LOCAL_SD:-false}
    restart: unless-stopped
    environment:
      <<: *app-env
      AGENTRY_API_URL: http://api:4000
      AGENTS_DIR: /app/agents
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      SKETCH_ALLOW_PLACEHOLDER: ${SKETCH_ALLOW_PLACEHOLDER:-false}
      SARKARI_DUNIYA_API_URL: ${SARKARI_DUNIYA_API_URL:-}
      SARKARI_DUNIYA_INGEST_KEY: ${SARKARI_DUNIYA_INGEST_KEY:-}
      SARKARI_DUNIYA_PUBLIC_URL: ${SARKARI_DUNIYA_PUBLIC_URL:-}
    volumes:
      - ./agents:/app/agents:ro
      - artifacts:/artifacts
      - hf-cache:/home/agentry/.cache/huggingface
    extra_hosts: *host-gateway
    depends_on:
      api:
        condition: service_healthy
    # Longer than SUPERVISOR_STOP_TIMEOUT_SEC (120s) so in-flight jobs can
    # finish instead of being killed and re-run as stalled.
    stop_grace_period: 150s
    networks: [backend]

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:4000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  artifacts:
  hf-cache:

networks:
  backend:
