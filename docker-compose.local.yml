# Local override: run the current images against the PostgreSQL and Redis
# running natively on this machine (DATABASE_URL / REDIS_URL from .env), with
# host networking and the familiar ports (web :5173, API :4000).
#
#   scripts/local-up.sh            # build + (re)start
#   scripts/local-up.sh logs -f    # any other compose command
#
# Plain `docker compose up` runs the same services on a private network.

x-host-env: &host-env
  REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  AZURE_STORAGE_CONTAINER_NAME_DEV: ${AZURE_STORAGE_CONTAINER_NAME_DEV:-}

services:
  migrate:
    network_mode: host
    networks: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}

  api:
    network_mode: host
    networks: !reset []
    environment:
      <<: *host-env
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Plain http://localhost -- secure cookies need HTTPS.
      COOKIE_SECURE: "false"
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  worker:
    network_mode: host
    networks: !reset []
    environment:
      <<: *host-env
      AGENTRY_API_URL: http://localhost:4000
    depends_on: !override
      api:
        condition: service_healthy

  web:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      API_UPSTREAM: http://127.0.0.1:4000
      WEB_LISTEN_PORT: "5173"
