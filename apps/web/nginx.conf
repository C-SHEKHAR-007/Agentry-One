server {
    listen 5173;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: every non-file path serves index.html
    location / {
        try_files $uri /index.html;
    }

    # Same-origin /api proxy the Vite dev server provides in development
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_buffering off;          # required for SSE progress streams
        proxy_read_timeout 3600s;
    }
}
