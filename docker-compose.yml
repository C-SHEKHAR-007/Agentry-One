services:
  api:
    build: ./apps/api
    network_mode: "host"
    volumes:
      - ./agents:/agents:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://agentry:agentry_dev@localhost:5432/agentry}
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379}
      - AGENTRY_CREDENTIALS_KEY=${AGENTRY_CREDENTIALS_KEY}
      - AGENTRY_API_KEY=${AGENTRY_API_KEY}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER_NAME_DEV=${AZURE_STORAGE_CONTAINER_NAME_DEV:-inspection-audit-files-dev}
      - STORAGE_PROVIDER=azure
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}

  web:
    build:
      context: ./apps/web
    network_mode: "host"
    depends_on:
      - api

  worker-runner:
    build:
      context: . # repo root: the worker needs both python/sdk and agents
      dockerfile: agents/sketch/Dockerfile
    network_mode: "host"
    command: ["python", "python/sdk/worker_supervisor.py"]
    volumes:
      - ./agents:/app/agents
      - ./python:/app/python
    environment:
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://localhost:11434}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER_NAME_DEV=${AZURE_STORAGE_CONTAINER_NAME_DEV:-inspection-audit-files-dev}
      - STORAGE_PROVIDER=azure
