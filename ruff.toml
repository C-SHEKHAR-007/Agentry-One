# Python lint for workers, SDK, connectors and scripts. Deliberately focused on
# real bugs (syntax errors, undefined names, unused/missing imports) rather
# than style, so it can gate CI without a mass reformat.
target-version = "py312"
extend-exclude = ["**/.venv", "**/node_modules", "artifacts"]

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[lint.per-file-ignores]
# Workers insert the repo root on sys.path before importing python.sdk.
"agents/*/worker.py" = ["E402"]
