name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, unit tests, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentry
          POSTGRES_PASSWORD: agentry
          POSTGRES_DB: agentry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentry" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://agentry:agentry@localhost:5432/agentry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - name: Migrations apply cleanly and match schema.prisma
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npx vite build

  python:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio requests bullmq pillow
      - run: python -m pytest python/sdk/tests -q -c python/sdk/pytest.ini --rootdir python/sdk

  e2e:
    name: End-to-end (API + worker + browser)
    runs-on: ubuntu-latest
    needs: [api, web, python]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentry
          POSTGRES_PASSWORD: agentry
          POSTGRES_DB: agentry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentry" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agentry:agentry@localhost:5432/agentry
      REDIS_URL: redis://localhost:6379
      PORT: "4000"
      HOST: 127.0.0.1
      AGENTRY_API_URL: http://127.0.0.1:4000
      AGENTRY_API_KEY: ci-e2e-api-key-0123456789
      PUBLIC_API_BASE: ""
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --prefix apps/api
          npm ci --prefix apps/web
          npm ci --prefix apps/e2e
          npx --prefix apps/e2e playwright install --with-deps chromium
          pip install requests bullmq
      - name: Start API and echo worker
        run: |
          export AGENTRY_CREDENTIALS_KEY="$(openssl rand -base64 32)"
          export ARTIFACTS_DIR="$RUNNER_TEMP/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          (cd apps/api && npx prisma generate && npx prisma migrate deploy)
          (cd apps/api && nohup npx tsx src/server.ts > "$RUNNER_TEMP/api.log" 2>&1 &)
          nohup python agents/echo-agent/worker.py > "$RUNNER_TEMP/worker.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4000/health && break; sleep 1; done
      - name: API smoke test (flows + security boundaries)
        run: python scripts/e2e_smoke.py
      - name: Browser tests
        working-directory: apps/e2e
        env:
          E2E_API_URL: http://127.0.0.1:4000
          E2E_EMAIL: e2e-owner@example.com
          E2E_PASSWORD: e2e-owner-password
        run: |
          # The smoke test ends by tripping the per-IP login rate limit (10/min).
          sleep 65
          curl -sf -X POST "$AGENTRY_API_URL/users" -H "X-API-Key: $AGENTRY_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\",\"role\":\"owner\"}"
          npx playwright test
      - name: Service logs
        if: failure()
        run: |
          echo "::group::api.log"; cat "$RUNNER_TEMP/api.log" || true; echo "::endgroup::"
          echo "::group::worker.log"; cat "$RUNNER_TEMP/worker.log" || true; echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
