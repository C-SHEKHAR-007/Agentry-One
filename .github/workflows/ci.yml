name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, unit tests, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentry
          POSTGRES_PASSWORD: agentry
          POSTGRES_DB: agentry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentry" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://agentry:agentry@localhost:5432/agentry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .
      - name: Unit tests (no infrastructure)
        run: npm test
      - name: Migrations apply cleanly and match schema.prisma
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Integration tests (against the migrated service database)
        env:
          AGENTRY_CREDENTIALS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: npm run test:integration

  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npx vite build

  python:
    name: Python (lint, SDK tests)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/sdk/requirements.txt pytest pytest-asyncio pillow ruff==0.8.4
      - run: ruff check .
      - run: python -m pytest python/sdk/tests -q -c python/sdk/pytest.ini --rootdir python/sdk

  e2e:
    name: End-to-end (docker compose stack + browser)
    runs-on: ubuntu-latest
    needs: [api, web, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            echo "AGENTRY_API_KEY=ci-$(openssl rand -hex 16)"
            echo "AGENTRY_CREDENTIALS_KEY=$(openssl rand -base64 32)"
            echo "WEB_PORT=8080"
            echo "COOKIE_SECURE=false"
            echo "SKETCH_ALLOW_PLACEHOLDER=true"
          } > .env
      - name: Build and start the stack (the real deployment images)
        run: docker compose up -d --build --wait
      - name: API smoke test through nginx (flows + security boundaries)
        run: |
          pip install requests
          set -a; . ./.env; set +a
          AGENTRY_API_URL=http://localhost:8080/api python scripts/e2e_smoke.py
      - name: Browser tests against the nginx deployment (incl. CSP)
        working-directory: apps/e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_EMAIL: e2e-owner@example.com
          E2E_PASSWORD: e2e-owner-password
        run: |
          npm ci
          npx playwright install --with-deps chromium
          set -a; . ../../.env; set +a
          # The smoke test ends by tripping the per-IP login rate limit (10/min).
          sleep 65
          curl -sf -X POST "$E2E_BASE_URL/api/users" -H "X-API-Key: $AGENTRY_API_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\",\"role\":\"owner\"}"
          npx playwright test
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
      - if: always()
        run: docker compose down -v
